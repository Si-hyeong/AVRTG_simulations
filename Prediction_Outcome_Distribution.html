<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-scene Synthetic Mismatch AV View</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #1a1a1a; }
    :root {
      --color-text-primary: #1a1a1a; --color-text-secondary: #555;
      --color-text-tertiary: #999; --color-text-success: #166534;
      --color-text-danger: #991b1b; --color-text-info: #1e40af;
      --color-background-primary: #fff; --color-background-secondary: #f5f5f5;
      --color-background-success: #dcfce7; --color-background-info: #dbeafe;
      --color-border-tertiary: rgba(0,0,0,0.1); --color-border-secondary: rgba(0,0,0,0.2);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #e5e5e5; }
      :root {
        --color-text-primary: #e5e5e5; --color-text-secondary: #aaa;
        --color-text-tertiary: #666; --color-text-success: #86efac;
        --color-text-danger: #fca5a5; --color-text-info: #93c5fd;
        --color-background-primary: #111; --color-background-secondary: #1e1e1e;
        --color-background-success: #14532d; --color-background-info: #1e3a5f;
        --color-border-tertiary: rgba(255,255,255,0.1); --color-border-secondary: rgba(255,255,255,0.2);
      }
    }
    #root { height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- ── 내장 데이터 ───────────────────────────────────────── -->
<script id="data-v1" type="application/json">
PASTE_V1_JSON_HERE
</script>
<script id="data-v2" type="application/json">
PASTE_V2_JSON_HERE
</script>
<script id="data-manifest" type="application/json">
PASTE_MANIFEST_JSON_HERE
</script>

<!-- ── App ──────────────────────────────────────────────── -->
<script type="text/babel">
const { useState, useMemo } = React;

// 내장 데이터 파싱
const BUILTIN_V1       = JSON.parse(document.getElementById("data-v1").textContent);
const BUILTIN_V2       = JSON.parse(document.getElementById("data-v2").textContent);
const BUILTIN_MANIFEST = JSON.parse(document.getElementById("data-manifest").textContent);

const C = {
  aligned:"#4C9BE8", vis_only:"#F4A03A", aud_only:"#6DBF7E",
  pred_v1:"#7F77DD", pred_v2:"#D45394",
  hit:"#4C9BE8", miss:"#F4A03A", fp:"#D3D1C7",
};
const SLOT_COLORS = {
  aligned:    {bg:"#EEF4FD",border:"#4C9BE8",text:"#185FA5",badge:"#4C9BE8"},
  visual_only:{bg:"#FEF5E7",border:"#F4A03A",text:"#854F0B",badge:"#F4A03A"},
  audio_only: {bg:"#EDF7F0",border:"#6DBF7E",text:"#3B6D11",badge:"#6DBF7E"},
  none:       {bg:"var(--color-background-secondary)",border:"var(--color-border-tertiary)",text:"var(--color-text-tertiary)",badge:"#B4B2A9"},
};

const toSegs = arr => (arr||[]).map(s=>[+s[0],+s[1]]);
const allGT  = r   => [...toSegs(r.gt_aligned),...toSegs(r.gt_vis_only),...toSegs(r.gt_aud_only)];

function Timeline({r, p1, p2, dur}) {
  const LW=118, W=480, H=15, G=6;
  const rows = [
    {l:"Aligned GT",     s:r.gt_aligned||[],  col:C.aligned},
    {l:"Visual-only GT", s:r.gt_vis_only||[], col:C.vis_only},
    {l:"Audio-only GT",  s:r.gt_aud_only||[], col:C.aud_only},
    ...(p1?[{l:"Pred (V1)",s:p1,col:C.pred_v1}]:[]),
    ...(p2?[{l:"Pred (V2)",s:p2,col:C.pred_v2}]:[]),
  ];
  const sc=W/dur, n=rows.length, svgH=n*(H+G)+20;
  return (
    <svg width="100%" viewBox={`0 0 ${LW+W+6} ${svgH}`} style={{display:"block"}}>
      {[0,.25,.5,.75,1].map((t,i)=>(
        <line key={i} x1={LW+t*W} y1={0} x2={LW+t*W} y2={svgH-16}
              stroke="var(--color-border-tertiary)" strokeWidth="0.5" strokeDasharray="2 3"/>
      ))}
      {rows.map((row,ri)=>{
        const y=ri*(H+G);
        return (
          <g key={ri}>
            <text x={LW-5} y={y+H/2} fontSize="10" textAnchor="end"
                  dominantBaseline="central" fill="var(--color-text-secondary)">{row.l}</text>
            <rect x={LW} y={y} width={W} height={H} rx="3"
                  fill="var(--color-background-secondary)" opacity="0.5"/>
            {row.s.map(([s,e],si)=>(
              <rect key={si} x={LW+s*sc} y={y} width={Math.max(2,(e-s)*sc)}
                    height={H} rx="2" fill={row.col} opacity="0.88"/>
            ))}
          </g>
        );
      })}
      {[0,.25,.5,.75,1].map((t,i)=>(
        <text key={i} x={LW+t*W} y={svgH-3} fontSize="10" textAnchor="middle"
              fill="var(--color-text-tertiary)">{(t*dur).toFixed(1)}s</text>
      ))}
    </svg>
  );
}

function SlotInfo({mf}) {
  if(!mf) return null;
  const vt=mf.visual_track||[], at=mf.audio_track||[];
  const n=Math.max(vt.length,at.length);
  const TL={aligned:"A+V",visual_only:"V",audio_only:"A",none:"—"};
  return (
    <div>
      <div style={{fontSize:11,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:6}}>
        Slot info — {n} slots
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"separate",borderSpacing:"0 3px",fontSize:10}}>
          <thead>
            <tr>
              <td style={{width:52,paddingBottom:3,color:"var(--color-text-tertiary)"}}></td>
              {Array.from({length:n},(_,i)=>(
                <td key={i} style={{textAlign:"center",color:"var(--color-text-tertiary)",paddingBottom:3,minWidth:80}}>#{i}</td>
              ))}
            </tr>
          </thead>
          <tbody>
            {[["Visual",vt],["Audio",at]].map(([lbl,track])=>(
              <tr key={lbl}>
                <td style={{fontSize:11,color:"var(--color-text-secondary)",fontWeight:500,paddingRight:4,verticalAlign:"middle"}}>{lbl}</td>
                {track.map((slot,i)=>{
                  const tt=slot.target_type||"none", sc=SLOT_COLORS[tt];
                  return (
                    <td key={i} title={`${slot.label} (${tt})`}>
                      <div style={{background:sc.bg,border:`1px solid ${sc.border}`,borderRadius:4,padding:"3px 4px",textAlign:"center",position:"relative"}}>
                        {tt!=="none"&&(
                          <div style={{position:"absolute",top:2,right:2,background:sc.badge,color:"#fff",fontSize:8,fontWeight:700,borderRadius:2,padding:"0 2px",lineHeight:"13px"}}>{TL[tt]}</div>
                        )}
                        <div style={{color:sc.text,fontWeight:tt!=="none"?600:400,marginTop:tt!=="none"?9:0,lineHeight:1.3,wordBreak:"break-word"}}>{slot.label}</div>
                        <div style={{color:"var(--color-text-tertiary)",fontSize:9}}>{slot.duration?.toFixed(1)}s</div>
                      </div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex",gap:10,marginTop:5,flexWrap:"wrap"}}>
        {[["aligned","A+V","Aligned"],["visual_only","V","Visual-only"],["audio_only","A","Audio-only"],["none","—","Filler"]].map(([tt,badge,label])=>{
          const sc=SLOT_COLORS[tt];
          return (
            <div key={tt} style={{display:"flex",alignItems:"center",gap:3}}>
              <div style={{background:sc.bg,border:`1px solid ${sc.border}`,borderRadius:2,padding:"0 4px",fontSize:9,color:sc.text,fontWeight:600}}>{badge}</div>
              <span style={{fontSize:10,color:"var(--color-text-secondary)"}}>{label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SummaryBars({items, keys, colors, labels, title}) {
  const LW=52, W=380, RW=42, BH=18, G=3, svgH=items.length*(BH+G)+20;
  return (
    <div style={{marginBottom:20}}>
      <div style={{fontSize:11,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:6}}>{title}</div>
      <svg width="100%" viewBox={`0 0 ${LW+W+RW} ${svgH}`} style={{display:"block"}}>
        {[0,.25,.5,.75,1].map((v,i)=>(
          <line key={i} x1={LW+v*W} y1={0} x2={LW+v*W} y2={svgH-16}
                stroke="var(--color-border-tertiary)" strokeWidth="0.5" strokeDasharray="2 3"/>
        ))}
        {items.map((item,ri)=>{
          const y=ri*(BH+G); let cx=LW;
          const total=keys.reduce((s,k)=>s+(item[k]||0),0);
          const isEmpty=total===0;
          return (
            <g key={item.id}>
              <text x={LW-4} y={y+BH/2} fontSize="9" textAnchor="end"
                    dominantBaseline="central" fill="var(--color-text-secondary)">{item.id.replace("sample_","#")}</text>
              <rect x={LW} y={y} width={W} height={BH} rx="3" fill="var(--color-background-secondary)" opacity="0.4"/>
              {!isEmpty && keys.map(k=>{
                const w=(item[k]||0)/total*W; const x=cx; cx+=w;
                return w>0.5?<rect key={k} x={x} y={y} width={w} height={BH} rx="2" fill={colors[k]} opacity="0.88"/>:null;
              })}
              <text x={LW+W+4} y={y+BH/2} fontSize="9" textAnchor="start"
                    dominantBaseline="central" fill="var(--color-text-tertiary)">{item.iou?.toFixed(2)}</text>
            </g>
          );
        })}
        {[0,.25,.5,.75,1].map((v,i)=>(
          <text key={i} x={LW+v*W} y={svgH-3} fontSize="9" textAnchor="middle"
                fill="var(--color-text-tertiary)">{(v*100).toFixed(0)}%</text>
        ))}
      </svg>
      <div style={{display:"flex",gap:10,marginTop:4,flexWrap:"wrap"}}>
        {keys.map(k=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:9,height:9,borderRadius:2,background:colors[k],flexShrink:0}}/>
            <span style={{fontSize:10,color:"var(--color-text-secondary)"}}>{labels[k]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const v1       = BUILTIN_V1;
  const v2       = BUILTIN_V2;
  const manifest = BUILTIN_MANIFEST;

  const [tab,setTab]=useState("sample");
  const [sel,setSel]=useState(null);

  const v1Map=useMemo(()=>Object.fromEntries(v1.map(r=>[r.sample_id,r])),[]);
  const v2Map=useMemo(()=>Object.fromEntries(v2.map(r=>[r.sample_id,r])),[]);
  const mfMap=useMemo(()=>Object.fromEntries(manifest.map(r=>[r.sample_id,r])),[]);
  const samples=useMemo(()=>[...new Set([...Object.keys(v1Map),...Object.keys(v2Map)])].sort(),[]);

  const active=sel||samples[0]||null;
  const aR1=active?v1Map[active]:null;
  const aR2=active?v2Map[active]:null;
  const aR=aR1||aR2;
  const aMF=active?mfMap[active]:null;
  const aDur=aR?+(aR.total_duration||30):30;
  const ap1=aR1?.pred_segments?toSegs(aR1.pred_segments):null;
  const ap2=aR2?.pred_segments?toSegs(aR2.pred_segments):null;
  const iou1=aR1?.iou??null;
  const iou2=aR2?.iou??null;

  const summaryData=useMemo(()=>{
    const build=map=>samples.map(sid=>{
      const r=map[sid]; if(!r) return null;
      const a=r.attribution||{};
      const hit=(a.hit_aligned||0)+(a.hit_vis_only||0)+(a.hit_aud_only||0);
      const miss=(a.miss_aligned||0)+(a.miss_vis_only||0)+(a.miss_aud_only||0);
      return {id:sid,iou:r.iou||0,hit,miss,fp:a.fp||0,
        hit_aligned:a.hit_aligned||0,hit_vis_only:a.hit_vis_only||0,hit_aud_only:a.hit_aud_only||0,
        miss_aligned:a.miss_aligned||0,miss_vis_only:a.miss_vis_only||0,miss_aud_only:a.miss_aud_only||0};
    }).filter(Boolean);
    return {v1:build(v1Map),v2:build(v2Map)};
  },[]);

  const avg=(arr,k)=>arr.length?arr.reduce((s,i)=>s+(i[k]||0),0)/arr.length:0;

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      <div style={{padding:"10px 16px",borderBottom:"1px solid var(--color-border-tertiary)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontSize:14,fontWeight:500}}>Multi-scene synthetic mismatch AV View</div>
            <div style={{fontSize:10,color:"var(--color-text-tertiary)",marginTop:2}}>
              AVRTG · 02_8slots_target_2v2a2a2m · Gemini 2.5 Pro · 5 FPS · 480p
            </div>
          </div>
          <div style={{display:"flex",borderRadius:5,overflow:"hidden",border:"1px solid var(--color-border-secondary)"}}>
            {[["sample","Sample"],["summary","Summary"]].map(([t,l])=>(
              <button key={t} onClick={()=>setTab(t)} style={{padding:"4px 14px",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:tab===t?500:400,background:tab===t?"var(--color-text-primary)":"var(--color-background-secondary)",color:tab===t?"var(--color-background-primary)":"var(--color-text-secondary)"}}>
                {l}
              </button>
            ))}
          </div>
        </div>
      </div>

      {tab==="sample" ? (
        <div style={{flex:1,display:"flex",overflow:"hidden"}}>
          <div style={{width:148,flexShrink:0,borderRight:"1px solid var(--color-border-tertiary)",overflowY:"auto",padding:"6px 0"}}>
            {samples.map(sid=>{
              const r1=v1Map[sid], r2=v2Map[sid], isActive=sid===active;
              return (
                <div key={sid} onClick={()=>setSel(sid)} style={{padding:"7px 10px",cursor:"pointer",borderLeft:`3px solid ${isActive?"var(--color-text-primary)":"transparent"}`,background:isActive?"var(--color-background-secondary)":"transparent"}}>
                  <div style={{fontSize:11,fontWeight:isActive?500:400,color:isActive?"var(--color-text-primary)":"var(--color-text-secondary)",marginBottom:2}}>{sid.replace("sample_","#")}</div>
                  <div style={{fontSize:10,color:"var(--color-text-tertiary)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(r1||r2)?.query}</div>
                  <div style={{display:"flex",gap:4,marginTop:3}}>
                    {r1&&<span style={{fontSize:9,padding:"1px 4px",borderRadius:3,background:"#EEEDFe",color:"#534AB7"}}>V1 {r1.iou?.toFixed(2)}</span>}
                    {r2&&<span style={{fontSize:9,padding:"1px 4px",borderRadius:3,background:"#FBEAF0",color:"#993556"}}>V2 {r2.iou?.toFixed(2)}</span>}
                  </div>
                </div>
              );
            })}
          </div>
          {aR&&(
            <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:500}}>{aR.query}</span>
                {iou1!==null&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#EEEDFe",color:"#534AB7"}}>V1 IoU={iou1.toFixed(3)}</span>}
                {iou2!==null&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:"#FBEAF0",color:"#993556"}}>V2 IoU={iou2.toFixed(3)}</span>}
              </div>
              <div style={{background:"var(--color-background-secondary)",borderRadius:7,padding:"10px 8px 5px",marginBottom:10}}>
                <Timeline r={aR} p1={ap1} p2={ap2} dur={aDur}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:10}}>
                {[["Aligned GT",aR.gt_aligned,C.aligned],["Visual-only GT",aR.gt_vis_only,C.vis_only],["Audio-only GT",aR.gt_aud_only,C.aud_only]].map(([title,segs,col])=>(
                  <div key={title} style={{borderRadius:6,padding:"7px 10px",border:"1px solid var(--color-border-tertiary)"}}>
                    <div style={{fontSize:11,fontWeight:500,color:col,marginBottom:3}}>{title}</div>
                    {(segs||[]).length===0?<span style={{fontSize:11,color:"var(--color-text-tertiary)"}}>—</span>
                      :(segs||[]).map(([s,e],i)=>(
                        <div key={i} style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)"}}>{(+s).toFixed(2)}s – {(+e).toFixed(2)}s</div>
                      ))}
                  </div>
                ))}
              </div>
              <div style={{background:"var(--color-background-secondary)",borderRadius:7,padding:"10px 12px"}}>
                <SlotInfo mf={aMF}/>
              </div>
            </div>
          )}
        </div>
      ) : (
        <div style={{flex:1,overflowY:"auto",padding:"14px 20px"}}>
          {[["v1","V1",summaryData.v1],["v2","V2",summaryData.v2]].map(([ver,label,items])=>{
            if(!items.length) return null;
            return (
              <div key={ver} style={{marginBottom:32}}>
                <div style={{fontSize:13,fontWeight:500,marginBottom:4,borderBottom:"1px solid var(--color-border-tertiary)",paddingBottom:6}}>
                  Prompt {label}
                  <span style={{fontSize:11,fontWeight:400,color:"var(--color-text-tertiary)",marginLeft:10}}>avg IoU = {avg(items,"iou").toFixed(3)}</span>
                </div>
                <SummaryBars items={items} keys={["hit","miss","fp"]} colors={{hit:C.hit,miss:C.miss,fp:C.fp}} labels={{hit:"Hit",miss:"Miss",fp:"False Positive"}} title="① Overall — Hit / Miss / False Positive (IoU on right)"/>
                <SummaryBars items={items} keys={["hit_aligned","hit_vis_only","hit_aud_only"]} colors={{hit_aligned:C.aligned,hit_vis_only:C.vis_only,hit_aud_only:C.aud_only}} labels={{hit_aligned:"Aligned",hit_vis_only:"Visual-only",hit_aud_only:"Audio-only"}} title="② Within hit — which GT type was found"/>
                <SummaryBars items={items} keys={["miss_aligned","miss_vis_only","miss_aud_only"]} colors={{miss_aligned:"#B5D4F4",miss_vis_only:"#FAC775",miss_aud_only:"#C0DD97"}} labels={{miss_aligned:"Aligned",miss_vis_only:"Visual-only",miss_aud_only:"Audio-only"}} title="③ Within miss — which GT type was missed"/>
              </div>
            );
          })}
          {summaryData.v1.length>0&&summaryData.v2.length>0&&(
            <div style={{padding:"10px 14px",borderRadius:7,background:"var(--color-background-secondary)",fontSize:12,color:"var(--color-text-secondary)"}}>
              V1 avg IoU <strong>{avg(summaryData.v1,"iou").toFixed(3)}</strong>
              <span style={{margin:"0 10px",opacity:.3}}>|</span>
              V2 avg IoU <strong>{avg(summaryData.v2,"iou").toFixed(3)}</strong>
              <span style={{margin:"0 10px",opacity:.3}}>|</span>
              Δ <strong style={{color:avg(summaryData.v2,"iou")>avg(summaryData.v1,"iou")?"var(--color-text-success)":"var(--color-text-danger)"}}>
                {avg(summaryData.v2,"iou")>avg(summaryData.v1,"iou")?"+":""}{(avg(summaryData.v2,"iou")-avg(summaryData.v1,"iou")).toFixed(3)}
              </strong>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
